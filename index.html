<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoloBG. Play More!</title>

<style>

@font-face{

    font-family:"Vazirmatn";

    src:url("./fonts/Vazirmatn-Regular.woff2") format("woff2");

    font-weight:400;

    font-style:normal;

    font-display:swap;

}


@font-face{

    font-family:"Vazirmatn";

    src:url("./fonts/Vazirmatn-Medium.woff2") format("woff2");

    font-weight:500;

    font-style:normal;

    font-display:swap;

}


*{
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;
    margin:0;

}


body{

    font-family:"Vazirmatn",Tahoma,sans-serif;

    background:#111;

    color:#f7f5ef;

    overflow:hidden;

}



/* صفحه */

.hero{

    position:relative;

    width:100%;

    height:100vh;

    overflow:hidden;

    background:#111;
}



/* تصویر */

.bg{

    position:absolute;

    top:8vh;

    left:0;

    width:100%;

    height:84vh;

    object-fit:cover;

    z-index:0;

}



/* تاریکی */

.overlay{

    position:absolute;

    inset:0;

    z-index:1;


    background:

    linear-gradient(
        90deg,
        rgba(5,10,12,.72),
        rgba(5,10,12,.38) 45%,
        rgba(5,10,12,.05)
    );

}



/* محتوا دسکتاپ */

.content{

    position:absolute;

    z-index:2;


    width:min(620px,45vw);


    left:8vw;

    top:50%;


    transform:translateY(-50%);


    direction:rtl;

    text-align:center;

}



/* شعار */

.title{

    margin:0;


    font-size:clamp(1.3rem,2vw,2rem);


    font-weight:500;


    line-height:1.8;

    letter-spacing:-0.04em;

    white-space:nowrap;

}



/* توضیح */

.description{

    margin-top:.7rem;


    font-size:1rem;


    font-weight:300;


    color:rgba(255,255,255,.82);

}



/* لوگو */

.logo{

    display:block;


    width:130px;

    height:130px;


    object-fit:contain;


    margin:2rem auto 2rem;

}



/* شبکه ها */

.social{

    display:flex;


    justify-content:center;


    gap:2rem;


    direction:ltr;

}



.social a{

    display:flex;

    align-items:center;

    gap:.45rem;


    color:white;


    text-decoration:none;


    font-size:.85rem;


    opacity:.88;


    transition:.3s;

}



.social a:hover{

    opacity:1;

    transform:translateY(-2px);

}



.social img{

    width:18px;

    height:18px;

    object-fit:contain;

    filter:brightness(0) invert(1);

}


/* امضا */

.signature{

    margin-top:2rem;


    direction:ltr;


    font-family:Georgia,serif;


    font-size:.85rem;


    letter-spacing:.22em;


    opacity:.65;

}




/* موبایل */

@media(max-width:900px){


    body{

        overflow:hidden;

    }



    .hero{

        height:100svh;

    }

    .bg{
	object-fit:contain;
    }

    .overlay{


        background:

        linear-gradient(
            180deg,
            rgba(5,10,12,.45),
            rgba(5,10,12,.75)
        );

    }



    .content{


        left:50%;


        top:50%;


        transform:translate(-50%,-50%);


        width:88vw;

    }



    .title{


        white-space:normal;


        font-size:1.15rem;


        line-height:1.8;


    }



    .description{

        margin-top:.6rem;

        font-size:.85rem;

    }



    .logo{


        width:80px;

        height:80px;


        margin:.8rem auto;

    }



    .social{


        gap:1rem;

    }

    .social a{

        font-size:.8rem;

    }

    .signature{


        margin-top:1.2rem;


        font-size:.72rem;

    }


}


</style>

</head>


<body>


<div class="hero">


<img class="bg" src="./images/bg.jpg" alt="">


<div class="overlay"></div>



<section class="content">


<h1 class="title">
وقتی شوق بازی هست، اما هم‌بازی نیست!
</h1>



<div class="description">
آموزش، ترجمه، طراحی و تولید؛ در مسیر سولو
</div>



<img class="logo" src="./images/logo.png" alt="SoloBG">



<div class="social">

<a href="https://www.youtube.com/@SoloBG_ir" target="_blank" rel="noopener">
    <img src="./images/youtube.svg" alt="">
    YouTube
</a>

<a href="https://www.instagram.com/solobg_ir" target="_blank" rel="noopener">
    <img src="./images/instagram.svg" alt="">
    Instagram
</a>

<a href="https://t.me/solobg_ir" target="_blank" rel="noopener">
    <img src="./images/telegram.svg" alt="">
    Telegram
</a>

</div>

<div class="signature">

Play Solo. Play More.

</div>



</section>


</div>


</body>

</html>
